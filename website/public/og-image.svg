<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AdBreak Arcade</title>
  <desc id="desc">A conceptual notification-first mini-game interface in a warm orange and charcoal product system.</desc>
  <rect width="1200" height="630" fill="#151515"/>
  <path d="M0 86h1200M0 544h1200M82 0v630M1118 0v630" stroke="#45453f" stroke-width="1" opacity=".7"/>
  <rect x="82" y="0" width="1" height="630" fill="#e56b45" opacity=".65"/>
  <g transform="translate(100 116)">
    <text x="0" y="0" fill="#f0805b" font-family="monospace" font-size="15" letter-spacing="3">NOTIFICATION-FIRST MINI-GAMES</text>
    <text x="0" y="96" fill="#f2f0e9" font-family="system-ui,sans-serif" font-weight="700" font-size="78">Your next game</text>
    <text x="0" y="178" fill="#f2f0e9" font-family="system-ui,sans-serif" font-weight="700" font-size="78">is already here.</text>
    <text x="2" y="242" fill="#a6a59e" font-family="system-ui,sans-serif" font-size="24">25 short offline games, played from an</text>
    <text x="2" y="276" fill="#a6a59e" font-family="system-ui,sans-serif" font-size="24">expanded Android notification.</text>
    <rect x="0" y="334" width="194" height="54" fill="#e56b45"/>
    <text x="97" y="369" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700" font-size="17">EXPLORE THE ARCADE</text>
  </g>
  <g transform="translate(790 128)">
    <rect width="292" height="380" fill="#202020" stroke="#55554d" stroke-width="2"/>
    <rect x="20" y="28" width="252" height="80" fill="#292929"/>
    <text x="40" y="52" fill="#f0805b" font-family="monospace" font-size="11" letter-spacing="1.5">ADBREAK ARCADE</text>
    <text x="40" y="80" fill="#f2f0e9" font-family="system-ui,sans-serif" font-weight="700" font-size="21">Tap Counter</text>
    <text x="40" y="98" fill="#a6a59e" font-family="monospace" font-size="11">READY · 00 SCORE</text>
    <rect x="20" y="126" width="252" height="224" fill="#151515" stroke="#45453f"/>
    <text x="42" y="160" fill="#f0805b" font-family="monospace" font-size="11" letter-spacing="2">EXPANDED</text>
    <text x="42" y="198" fill="#f2f0e9" font-family="system-ui,sans-serif" font-weight="700" font-size="24">Make one move.</text>
    <rect x="42" y="224" width="208" height="48" fill="#e56b45"/>
    <text x="146" y="255" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" letter-spacing="1">TAP</text>
    <rect x="42" y="286" width="98" height="30" rx="15" fill="#302a3b"/>
    <rect x="152" y="286" width="98" height="30" rx="15" fill="#302a3b"/>
    <text x="91" y="306" text-anchor="middle" fill="#c8c0d2" font-family="monospace" font-size="10">RESET</text>
    <text x="201" y="306" text-anchor="middle" fill="#c8c0d2" font-family="monospace" font-size="10">PAUSE</text>
  </g>
</svg>
