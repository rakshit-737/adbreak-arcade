name: Publish Android testing release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify tests, lint, and release artifacts
        run: ./gradlew testDebugUnitTest lintDebug check assembleDebug assembleRelease --stacktrace

      - name: Prepare checksums
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/adbreak-arcade-${GITHUB_REF_NAME}-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-assets/adbreak-arcade-${GITHUB_REF_NAME}-release-unsigned.apk
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "AdBreak Arcade $GITHUB_REF_NAME" --notes-file "$notes" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "AdBreak Arcade $GITHUB_REF_NAME" --generate-notes --prerelease
          fi
